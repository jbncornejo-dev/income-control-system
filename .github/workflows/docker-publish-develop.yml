name: Build and Push to Docker Hub (develop)

on:
  push:
    branches: [ develop ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push combined image for Render
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/production/Dockerfile-render
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/income-control-system:develop
          
      - name: Trigger Render Deploy Hook
        run: |
          curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK_DEVELOP }}