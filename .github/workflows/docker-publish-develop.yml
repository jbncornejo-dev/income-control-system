# .github/workflows/docker-publish-develop.yml
name: Build and Push to Docker Hub (develop)

on:
  push:
    branches: [ develop ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push php-fpm image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/common/php-fpm/Dockerfile
          target: production
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/income-control-system-php-fpm:develop

      - name: Build and push web (apache) image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/production/apache/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/income-control-system-web:develop