# Main Apache HTTP server configuration optimized for serving a Laravel application.
# The image is httpd:2.4, which builds all modules as shared objects (--enable-mods-shared=reallyall).

ServerRoot "/usr/local/apache2"

PidFile logs/httpd.pid

Timeout 60
KeepAlive On
MaxKeepAliveRequests 100
KeepAliveTimeout 65

Listen 80

# Load only the modules required to serve static files and proxy PHP to PHP-FPM.
# Order matters: proxy must be loaded before proxy_fcgi.
LoadModule mpm_prefork_module modules/mod_mpm_prefork.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule dir_module modules/mod_dir.so
LoadModule env_module modules/mod_env.so
LoadModule mime_module modules/mod_mime.so
LoadModule setenvif_module modules/mod_setenvif.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_fcgi_module modules/mod_proxy_fcgi.so

# The official httpd image starts as root and switches to this user/group for workers.
User www-data
Group www-data

ServerAdmin admin@localhost
ServerName localhost

# Deny access to the entirety of the server's filesystem.
<Directory />
    AllowOverride none
    Require all denied
</Directory>

DocumentRoot "/var/www/public"
<Directory "/var/www/public">
    Options -Indexes +FollowSymLinks

    # Allow the Laravel .htaccess (pretty URLs, trailing slashes, etc.).
    AllowOverride All

    Require all granted

    # Forward PHP requests to the PHP-FPM service using FastCGI.
    <FilesMatch \.php$>
        SetHandler "proxy:fcgi://php-fpm:9000"
    </FilesMatch>
</Directory>

<IfModule dir_module>
    DirectoryIndex index.php index.html
</IfModule>

# Prevent .htaccess and .htpasswd files from being viewed by Web clients.
<Files ".ht*">
    Require all denied
</Files>

# Log to stdout/stderr so Docker collects the logs.
ErrorLog /proc/self/fd/2
LogLevel warn

<IfModule log_config_module>
    LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" combined
    CustomLog /proc/self/fd/1 combined
</IfModule>

<IfModule mime_module>
    TypesConfig conf/mime.types
    AddType application/x-compress .Z
    AddType application/x-gzip .gz .tgz
</IfModule>